name: Despliegue Flutter Web

# ⚡ Se ejecuta automáticamente al hacer push a la rama 'main'
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona tu repositorio en el servidor de GitHub
      - name: Checkout del código
        uses: actions/checkout@v3

      # 2. Instala Flutter en el servidor
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Obtiene las dependencias (Equivalente a flutter pub get)
      - name: Instalar Dependencias
        run: flutter pub get

      # 4. ⚡ El comando crítico: Compila la versión web
      - name: Compilar Web
        run: flutter build web --base-href /indicators/

      # 5. Sube la carpeta compilada a GitHub Pages
      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web